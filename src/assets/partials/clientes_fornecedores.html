<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Clientes/Fornecedores</title>
    <script type="module" src="../assets/js/clientes_fornecedores.js"></script>
</head>

<body>

    <div class="app d-flex">

        <main class="flex-grow-1 p-4">
            <h1 class="h4 mb-3">Cadastro de Clientes/Fornecedores</h1>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <button class="btn btn-primary" onclick="abrirModalClienteFornecedor(null)">
                    Novo Cliente/Fornecedor
                </button>
                <div class="input-group" style="width: 300px;">
                    <input type="text" class="form-control" placeholder="Buscar" aria-label="Buscar" id="buscar-clientes">
                    <button class="btn btn-outline-secondary" type="button" id="button-search"><i
                            class="bi bi-search"></i></button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="tabelaClientesFornecedores">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Código</th>
                                    <th scope="col">Tipo</th>
                                    <th scope="col">Nome/Razão Social</th>
                                    <th scope="col">CPF/CNPJ</th>
                                    <th scope="col">Telefone</th>
                                    <th scope="col" class="text-center">Ação</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="clienteFornecedorModal" tabindex="-1" aria-labelledby="clienteFornecedorModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="clienteFornecedorModalLabel">Adicionar/Editar Cliente/Fornecedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formClienteFornecedor">
                        <input type="hidden" id="itemId" value="">
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="modalCodigo" class="form-label">Código</label>
                                <input type="text" class="form-control" id="modalCodigo" placeholder="Auto">
                            </div>
                            <div class="col-md-8 mb-3">
                                <label for="modalTipo" class="form-label">Tipo</label>
                                <select class="form-select" id="modalTipo">
                                    <option value="">Selecione...</option>
                                    <option value="cliente">Cliente</option>
                                    <option value="fornecedor">Fornecedor</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="modalNome" class="form-label">Nome ou Razão Social</label>
                            <input type="text" class="form-control" id="modalNome" placeholder="Nome completo">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="modalid" class="form-label">CPF/CNPJ</label>
                                <input type="text" class="form-control" id="modalid" placeholder="Somente números">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="modalTelefone" class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="modalTelefone" placeholder="(xx) xxxxx-xxxx">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="modalEmail" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="modalEmail" placeholder="email@exemplo.com">
                        </div>

                        <div class="mb-3">
                            <label for="modalEndereco" class="form-label">Endereço</label>
                            <input type="text" class="form-control" id="modalEndereco" placeholder="Rua, número, bairro...">
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarClienteFornecedor()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
