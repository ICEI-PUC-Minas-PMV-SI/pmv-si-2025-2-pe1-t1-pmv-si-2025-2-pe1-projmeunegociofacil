<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>Contas a Pagar</title>
  <style>
    .table-responsive {
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

  <div class="app d-flex">

    <main class="flex-grow-1 p-4">
      <h1 class="h4 mb-3">Contas a Pagar</h1>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contaPagarModal"
          onclick="abrirModalContaPagar(null)">
          <i class="bi bi-plus-lg me-2"></i>Nova Conta
        </button>
        
        <div class="input-group" style="width: 300px;">
          <input type="text" id="busca-pagar" class="form-control" placeholder="Buscar" aria-label="Buscar">
          <button class="btn btn-outline-secondary" type="button" id="btn-busca-pagar">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0" id="tabelaContasPagar">
              <thead class="table-light">
                <tr>
                  <th>Status</th>
                  <th>Fornecedor</th> <th>Descrição</th>
                  <th>Vencimento</th>
                  <th class="text-end">Valor</th>
                  <th class="text-center">Ações</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="contaPagarModal" tabindex="-1" aria-labelledby="contaPagarModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="contaPagarModalLabel">Adicionar Nova Conta a Pagar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formContaPagar">
            <input type="hidden" id="contaPagarId">
            
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select id="modalStatusConta" class="form-select">
                <option value="pendente">Pendente</option>
                <option value="pago">Pago</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Fornecedor</label>
              <select id="modalFornecedorConta" class="form-select">
                <option value="">Selecione um fornecedor...</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Descrição</label>
              <input type="text" id="modalDescricaoConta" class="form-control" placeholder="Ex: Aluguel, Luz, Material...">
            </div>

            <div class="mb-3">
              <label class="form-label">Vencimento</label>
              <input type="date" id="modalVencimentoConta" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Valor (R$)</label>
              <input type="number" id="modalValorConta" class="form-control" step="0.01" placeholder="0.00">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" onclick="salvarContaPagar()">Salvar</button>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="../assets/js/pagar.js"></script>

</body>
</html>
