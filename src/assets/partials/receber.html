<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>Contas a Receber</title>
  <style>
    .table-responsive {
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

  <div class="app d-flex">

    <main class="flex-grow-1 p-4">
      <h1 class="h4 mb-3">Contas a Receber</h1>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contaReceberModal"
          onclick="abrirModalContaReceber(null)">
          <i class="bi bi-plus-lg me-2"></i>Nova Fatura
        </button>
        
        <div class="input-group" style="width: 300px;">
          <input type="text" id="busca-receber" class="form-control" placeholder="Buscar" aria-label="Buscar">
          <button class="btn btn-outline-secondary" type="button" id="btn-busca-receber">
              <i class="bi bi-search"></i>
          </button>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0" id="tabelaContasReceber">
              <thead class="table-light">
                <tr>
                  <th scope="col">Status</th>
                  <th scope="col">Cliente</th>
                  <th scope="col">Descrição</th>
                  <th scope="col">Vencimento</th>
                  <th scope="col" class="text-end">Valor (R$)</th>
                  <th scope="col" class="text-center">Ação</th>
                </tr>
              </thead>
              <tbody>
                </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="contaReceberModal" tabindex="-1" aria-labelledby="contaReceberModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="contaReceberModalLabel">Adicionar/Editar Conta a Receber</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formContaReceber">
            <input type="hidden" id="contaReceberId" value="">
            
            <div class="mb-3">
              <label for="modalStatusReceber" class="form-label">Status</label>
              <select class="form-select" id="modalStatusReceber">
                <option value="pendente">Pendente</option>
                <option value="pago">Recebido / Pago</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="modalClienteConta" class="form-label">Cliente</label>
              <select id="modalClienteConta" class="form-select">
                <option value="">Selecione um cliente...</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="modalDescricaoReceber" class="form-label">Descrição</label>
              <textarea class="form-control" id="modalDescricaoReceber" rows="3" placeholder="Descrição do que precisa ser recebido"></textarea>
            </div>

            <div class="mb-3">
              <label for="modalVencimentoReceber" class="form-label">Data de Vencimento</label>
              <input type="date" class="form-control" id="modalVencimentoReceber">
            </div>

            <div class="mb-3">
              <label for="modalValorReceber" class="form-label">Valor</label>
              <input type="number" step="0.01" class="form-control" id="modalValorReceber" placeholder="0.00">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="salvarContaReceber()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="reciboModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Visualizar Recibo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="recibo-conteudo">
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="button" class="btn btn-success" onclick="imprimirRecibo()">
            <i class="bi bi-printer me-2"></i> Imprimir
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/receber.js"></script>

</body>
</html>
