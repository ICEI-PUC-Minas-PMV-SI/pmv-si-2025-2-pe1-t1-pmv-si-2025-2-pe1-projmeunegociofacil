<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <title>Configurações</title>

</head>

<body>
 
  <div class="app d-flex">

<!-- MAIN -->
    <main class="flex-grow-1 p-4">
      <h1 class="h4 mb-3">Configurações</h1>
      <div class="container align-items-center">
        <div class="d-flex justify-content-center">
          <div class="col-12 col-md-6 ">
            <form action="dashboard.html">
              <div class="form-group">
                <label for="user_name">Nome Completo</label>
                <input type="text" class="form-control mb-2" id="user_name" placeholder="Insira seu Nome Completo">
              </div>
              <div class="row ">
                <div class="col-3 align-self-center">
                  <div class="form-group">
                    <div class="form-check ">
                      <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                      <label class="form-check-label" for="flexRadioDefault1">
                        Pessoa Jurídica
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2"
                        checked>
                      <label class="form-check-label" for="flexRadioDefault2">
                        Pessoa Física
                      </label>
                    </div>
                  </div>
                </div>
                <div class="col align-self-center">
                  <div class="form-group">
                    <label for="user_name">CPF</label>
                    <input type="text" class="form-control" id="user_name" placeholder="Insira o CPF">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="user_name">Nome da Empresa</label>
                <input type="text" class="form-control mb-2" id="user_name" placeholder="Insira o Nome da Empresa">
              </div>
              <div class="form-group">
                <label for="user_name">Endereço</label>
                <input type="text" class="form-control mb-2" id="user_name" placeholder="Insira o Endereço">
              </div>
              <div class="form-group">
                <label for="user_name">Telefone</label>
                <input type="text" class="form-control mb-2" id="user_name" placeholder="Insira o número de Telefone">
              </div>
              <div class="form-group">
                <label for="user_mail">Endereço de E-mail</label>
                <input type="email" class="form-control mb-2" id="user_mail" aria-describedby="emailHelp"
                  placeholder="Insira seu e-mail">
              </div>
              <div class="form-group">
                <label for="user_password">Senha</label>
                <input type="password" class="form-control mb-3" id="user_password" placeholder="Insira sua senha">
              </div>


            </form>
          </div>
        </div>
        <div class="col-12 d-flex justify-content-center">

          <!-- <div class="modal-footer"> -->
          <button type="button" class="btn btn-primary">Atualizar Cadastro</button>
          <!-- </div> -->
        </div>
      </div>
    </main>

  </div>

</body>

</html>
