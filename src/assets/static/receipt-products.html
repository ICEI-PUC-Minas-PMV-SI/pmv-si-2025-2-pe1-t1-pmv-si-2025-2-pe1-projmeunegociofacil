<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Negócio Fácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="../js/login.js"></script>
    <script>
        // Verifica se o usuário já esta logado e se negativo, redireciona para tela de login        
        if (!usuarioCorrente.email_login) {
            window.location.assign("../../index.html");
        }

          function initPage() {

      


    }

    // Associa ao evento de carga da página a função para verificar se o usuário está logado
    window.addEventListener('load', initPage);

    </script>
</head>

<body class="p-3">
    <div class="card mx-auto" style="max-width: 900px;">
        <div class="card-body">
            <div class="header p-2">
                <div class="row">
                    <div class="col-2"><img src="../img/logo_home.png" alt="" width="100%" style="min-width: 200px;">
                    </div>
                    <div class="col"></div>
                    <div class="col-9  text-end align-items-baseline">Documento: <strong id="sale-number"></strong>
                    </div>
                </div>
            </div>
            <hr>

            <div id="sales-data">

                

            </div>
            <div class="sale-itens card mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Código</th>
                                    <th scope="col">Descrição</th>
                                    <th class="text-center" scope="col">Un</th>
                                    <th class="text-center" scope="col">Qtde.</th>
                                    <th class="text-end" scope="col">Valor</th>
                                    <th class="text-end" scope="col">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-products" class="table-group-divider">
                                <tr>
                                    <th scope="row">1</th>
                                    <td>Biscoito Recheado</td>
                                    <td class="text-center">UN</td>
                                    <td class="text-center">5</td>
                                    <td class="text-end">10,00</td>
                                    <td class="text-end">50,00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="sale-totalizer fields row mb-3">
                <div class="row ">
                    <div class="col-6">
                        <span><strong id="installments-title"> Parcelamento </strong></span>
                        <div class="table-responsive">
                            <table class="table mt-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">Vencimento</th>
                                        <th class="text-center" scope="col">Parcela</th>
                                        <th class="text-end" scope="col">Valor</th>
                                    </tr>
                                </thead>
                                <tbody class="table-group-divider">
                                    <tr>
                                        <td>10/11/2025</td>
                                        <td class="text-center"><strong>01/06</strong></td>
                                        <td class="text-end">10,00</td>

                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="col-6 text-end p-0">

                        <div id="calc-discount" class="div">
                            <strong><span> Subtotal: </span></strong><span id="amount-without-discount">50,00</span><br>
                            <strong><span>Desconto: </span></strong> <span id="amount-discount">10,00</span>
                        </div>
                        <strong><span> Valor Total: </span></strong> <span id="amount">49,90</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="signature">
            <div class="row "></div>
            <div class="col text-center"><strong>_______________________________________</strong></div>
            <div class="row "></div>
            <div class="col text-center"><strong class="name-buyer">Meu Cliente dos Santos</strong></div>
            <div class="row "></div>
            <div id="sale-date" class="col text-center mb-4">10 de novembro de 2025</div>
        </div>
    </div>
    <script src="../js/receipt-products.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
