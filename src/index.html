<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Negócio Fácil - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />

</head>

<body>



  <!-- Start Main -->
  <main class="container pt-5">

    <div class="topbar-home row align-items-center px-3 px-md-5 w-100 pb-3">
      <div class="col-12 col-md-6 text-center text-md-start mb-3 mb-md-0">
        <img src="assets/img/logo_home.png" class="img-fluid" style="max-width: 300px;">
      </div>
      <div class="col-12 col-md-6">
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <a class="btn btn-link px-4" data-bs-toggle="modal" data-bs-target="#SignUpModal">Efetuar Cadastro</a>
          <a class="btn btn-primary px-5" data-bs-toggle="modal" data-bs-target="#LoginModal">Login</a>
        </div>
      </div>
    </div>

    <div class="row my-5">
      <div class="col-12">
        <div id="carousel-home" class="carousel carousel-dark slide">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carousel-home" data-bs-slide-to="0" class="active"
              aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carousel-home" data-bs-slide-to="1" aria-label="Slide 2"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <a data-bs-toggle="modal" data-bs-target="#SignUpModal"><img src="assets/img/slideshow/1.png"
                  class="d-block w-100"></a>
            </div>
            <div class="carousel-item">
              <a data-bs-toggle="modal" data-bs-target="#LoginModal"><img src="assets/img/slideshow/2.png"
                  class="d-block w-100"></a>
            </div>

          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carousel-home" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carousel-home" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </div>

    <div class="footer-home row text-center pt-5 px-3 px-md-5 pb-5">

      <div class="col-12 col-md-4 mb-4 mb-md-0">
        <img src="assets/img/home-itens/completo.png" class="img-fluid" style="max-width: 180px;">
      </div>
      <div class="col-12 col-md-4 mb-4 mb-md-0">
        <img src="assets/img/home-itens/facil.png" class="img-fluid" style="max-width: 180px;">
      </div>
      <div class="col-12 col-md-4">
        <img src="assets/img/home-itens/gratuito.png" class="img-fluid" style="max-width: 180px;">
      </div>

    </div>

  </main>





  <!-- Modal Sign Up -->
  <div class="modal fade" id="SignUpModal" tabindex="-1" aria-labelledby="SignUpModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="SignUpModalLabel">Efetuar Cadastro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="container">

            <div class="col">
              <form id="signup-form">
                <div id="div-nome-fantasia" class="form-group">
                  <label for="sign-up-nome">Nome Completo</label>
                  <input type="text" class="form-control mb-2" id="sign-up-nome" placeholder="Insira seu Nome Completo">
                </div>
                <div class="row ">
                  <div class="col-3 align-self-center">
                    <div class="form-group">
                      <div class="form-check ">
                        <input class="form-check-input" type="radio" name="sign-up-is-pj" id="sign-up-is-pj">
                        <label class="form-check-label" for="sign-up-is-pj">
                          Pessoa Jurídica
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="sign-up-is-pj" id="sign-up-isnt-pj" checked>
                        <label class="form-check-label" for="sign-up-isnt-pj">
                          Pessoa Física
                        </label>
                      </div>
                    </div>
                  </div>
                  <div class="col align-self-center">
                    <div id="div-cpf-cnpj" class="form-group">
                      <label for="sign-up-cpf-cnpj">CPF</label>
                      <input type="text" class="form-control" id="sign-up-cpf-cnpj" placeholder="Insira o CPF">
                    </div>
                  </div>
                </div>
                <div id="div-nome-da-empresa" class="form-group d-none">
                  <label for="sign-up-razao-social">Nome da Empresa</label>
                  <input type="text" class="form-control mb-2" id="sign-up-razao-social"
                    placeholder="Insira o Nome da Empresa">
                </div>
                <div class="form-group">
                  <label for="sign-up-endereco">Endereço</label>
                  <input type="text" class="form-control mb-2" id="sign-up-endereco" placeholder="Insira o Endereço">
                </div>
                <div class="form-group">
                  <label for="sign-up-telefone">Telefone</label>
                  <input type="text" class="form-control mb-2" id="sign-up-telefone"
                    placeholder="Insira o número de Telefone">
                </div>
                <div class="form-group">
                  <label for="sign-up-email">Endereço de E-mail</label>
                  <input type="email" class="form-control mb-2" id="sign-up-email" aria-describedby="emailHelp"
                    placeholder="Insira seu e-mail">
                </div>
                <div class="form-group">
                  <label for="sign-up-password">Senha</label>
                  <input type="password" class="form-control mb-3" id="sign-up-password" placeholder="Insira sua senha">
                </div>
                <div class="form-group">
                  <label for="sign-up-password2">Repita a Senha</label>
                  <input type="password" class="form-control mb-3" id="sign-up-password2"
                    placeholder="Insira sua senha">
                </div>
                <div class="row text-end">
                  <div class="col">
                    <button type="submit" id="btn_salvar" class="btn btn-primary">Efetuar Cadastro</button>
                  </div>
                </div>


              </form>
            </div>



          </div>
          <!-- <div class="modal-footer">
          </div> -->
        </div>
      </div>
    </div>
  </div>

  <!-- End Modal Cadastro-->
  <!-- Start LoginModal-->
  <div class="modal fade" id="LoginModal" tabindex="-1" aria-labelledby="LoginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="LoginModalLabel">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <form id="login-form" class="form" method="post">
            <div class="row mb-3">
              <div class="form-group mb-3">
                <label for="username">E-mail</label><br>
                <input type="email" name="username" id="username" class="form-control" placeholder="Insira seu e-mail">
              </div>
              <div class="form-group mb-1">
                <label for="password">Senha</label><br>
                <input type="password" name="password" id="password" class="form-control"
                  placeholder="Insira sua senha">
              </div>
            </div>
          </form>
          <div class="row mb-2">

            <div class="col  text-end">
              <input type="submit" name="submit" class="btn btn-primary" value="Efetuar Login" form="login-form">
            </div>

          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- FIRST ACESS -->
  <div class="modal fade" id="first-acess-modal" tabindex="-1" aria-labelledby="first-acess-modalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-0 position-relative">

          <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"
            aria-label="Close" style="z-index: 10;"></button>

          <img src="assets/img/popup.png" alt="" class="img-fluid w-100 rounded">

          <button id="btn-ignore-help=modal" type="button"
            class="btn btn-secondary btn-sm position-absolute bottom-0 end-0 m-3">
            Não mostrar novamente
          </button>

        </div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
