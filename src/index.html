<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Negócio Fácil - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png" />

</head>

<body>



  <!-- Start Main -->
  <main class="container pt-5 align-items-center">
    <div class="topbar-home row align-items-center px-5 w-100 pb-3">

      <div class="col">
        <img src="img/logo_home.png" class="img-fluid" style="max-width: 400px;">
      </div>

      <div class="col d-flex justify-content-end align-items-center ">
        <a class="btn btn-link px-4" data-bs-toggle="modal" data-bs-target="#SignUpModal">Efetuar Cadastro</a>
        <a class="btn btn-primary px-5" data-bs-toggle="modal" data-bs-target="#LoginModal">Login</a>
      </div>

    </div>

    <div id="carousel-home" class="carousel  carousel-dark slide">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carousel-home" data-bs-slide-to="0" class="active" aria-current="true"
          aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carousel-home" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carousel-home" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <a data-bs-toggle="modal" data-bs-target="#SignUpModal"><img src="img/slideshow/init.png"
              class="d-block w-100"></a>

        </div>
        <div class="carousel-item">
          <a data-bs-toggle="modal" data-bs-target="#SignUpModal"><img src="img/slideshow/init.png"
              class="d-block w-100"></a>
        </div>
        <div class="carousel-item">
          <a data-bs-toggle="modal" data-bs-target="#SignUpModal"><img src="img/slideshow/init.png"
              class="d-block w-100"></a>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carousel-home" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carousel-home" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <div class="pt-5 footer-home row align-items-center px-5 pb-5">

      <div class="col">
        <img src="img/home-itens/completo.png">
      </div>
      <div class="col">
        <img src="img/home-itens/facil.png">
      </div>
      <div class="col">
        <img src="img/home-itens/gratuito.png">
      </div>
    </div>
  </main>





  <!-- Modal Sign Up -->
  <div class="modal fade" id="SignUpModal" tabindex="-1" aria-labelledby="SignUpModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="SignUpModalLabel">Efetuar Cadastro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="contaPagarId" value="">
          <div class="container">

            <div class="col">
              <form action="dashboard.html">
                <div class="form-group">
                  <label for="user_name">Nome Completo</label>
                  <input type="text" class="form-control mb-2" id="sign-up-nome" placeholder="Insira seu Nome Completo">
                </div>
                <div class="row ">
                  <div class="col-3 align-self-center">
                    <div class="form-group">
                      <div class="form-check ">
                        <input class="form-check-input" type="radio" name="sign-up-is-pj" id="sign-up-is-pj">
                        <label class="form-check-label" for="sign-up-is-pj">
                          Pessoa Jurídica
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="sign-up-is-pj" id="flexRadioDefault2"
                          checked>
                        <label class="form-check-label" for="flexRadioDefault2">
                          Pessoa Física
                        </label>
                      </div>
                    </div>
                  </div>
                  <div class="col align-self-center">
                    <div class="form-group">
                      <label for="user_name">CPF/CNPJ</label>
                      <input type="text" class="form-control" id="sign-up-cpf-cnpj" placeholder="Insira o CPF/CNPJ">
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label for="user_name">Nome da Empresa</label>
                  <input type="text" class="form-control mb-2" id="sign-up-razao-social"
                    placeholder="Insira o Nome da Empresa">
                </div>
                <div class="form-group">
                  <label for="user_name">Endereço</label>
                  <input type="text" class="form-control mb-2" id="sign-up-endereco" placeholder="Insira o Endereço">
                </div>
                <div class="form-group">
                  <label for="user_name">Telefone</label>
                  <input type="text" class="form-control mb-2" id="sign-up-telefone"
                    placeholder="Insira o número de Telefone">
                </div>
                <div class="form-group">
                  <label for="user_mail">Endereço de E-mail</label>
                  <input type="email" class="form-control mb-2" id="sign-up-email" aria-describedby="emailHelp"
                    placeholder="Insira seu e-mail">
                </div>
                <div class="form-group">
                  <label for="user_password">Senha</label>
                  <input type="password" class="form-control mb-3" id="sign-up-password" placeholder="Insira sua senha">
                </div>
                <div class="form-group">
                  <label for="user_password">Repita a Senha</label>
                  <input type="password" class="form-control mb-3" id="sign-up-password2"
                    placeholder="Insira sua senha">
                </div>

              </form>
            </div>



          </div>
          <div class="modal-footer">
            <button type="button" id="btn_salvar" class="btn btn-primary">Efetuar Cadastro</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- End Modal Cadastro-->
  <!-- Start LoginModal-->
  <div class="modal fade" id="LoginModal" tabindex="-1" aria-labelledby="LoginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="LoginModalLabel">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <form id="login-form" class="form" method="post" onsubmit="loginUser (this)">
            <div class="row mb-3">
              <div class="form-group mb-3">
                <label for="username">E-mail</label><br>
                <input type="text" name="username" id="username" class="form-control" placeholder="Insira seu e-mail">
              </div>
              <div class="form-group mb-1">
                <label for="password">Senha</label><br>
                <input type="password" name="password" id="password" class="form-control"
                  placeholder="Insira sua senha">
              </div>
            </div>
          </form>
          <div class="row mb-2">
            <div class="col"><a id="efetuar-teste" class="btn-link" href="#">Efetuar Teste</a>
            </div>

            <div class="col  text-end">
              <input type="submit" name="submit" class="btn btn-primary" value="Efetuar Login" form="login-form">
            </div>
            <!-- <div class="col  text-end">
              <input type="submit" name="submit" class="btn btn-primary" value="Efetuar Login" form="login-form">
            </div> -->
          </div>
        </div>
      </div>
    </div>

  </div>


  <!-- End LoginModal-->
  <script src="scripts/login.js"></script>

  <script>

    // Declara uma função para processar o formulário de login
    function processaFormLogin(event) {
      // Cancela a submissão do formulário para tratar sem fazer refresh da tela
      event.preventDefault();

      // Obtem os dados de login e senha a partir do formulário de login
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      // Valida login e se estiver ok, redireciona para tela inicial da aplicação
      resultadoLogin = loginUser(username, password);
      if (resultadoLogin) {
        window.location.href = 'dashboard.html';
      }
      else { // Se login falhou, avisa ao usuário
        alert('Usuário ou senha incorretos');
      }
    }

    function salvaLogin(event) {
      // Cancela a submissão do formulário para tratar sem fazer refresh da tela
      event.preventDefault();

      // Obtem os dados do formulário


      let nome = document.getElementById('sign-up-nome').value || "";
      let nomeRazao = document.getElementById('sign-up-razao-social').value || "";
      let isPj = document.getElementById('sign-up-is-pj').checked;
      let cpfCNPJ = document.getElementById('sign-up-cpf-cnpj').value || "";
      let endereco = document.getElementById('sign-up-endereco').value || "";
      let telefone = document.getElementById('sign-up-telefone').value || "";
      let email = document.getElementById('sign-up-email').value || "";
      let senha = document.getElementById('sign-up-password').value || "";
      let senha2 = document.getElementById('sign-up-password2').value;
      console.log(nome, nomeRazao, isPj, cpfCNPJ, endereco, telefone, email, senha, senha2)
      if (senha != senha2) {
        alert('As senhas informadas não conferem.');
        return
      }

      // Adiciona o usuário no banco de dados
      if (checkFields(nome, nomeRazao, isPj, cpfCNPJ, endereco, telefone, email, senha)) {
        return
      }

      addUser(nome, nomeRazao, isPj, cpfCNPJ, endereco, telefone, email, senha);
      alert('Usuário salvo com sucesso. Proceda com o login para ');
      bootstrap.Modal.getInstance(document.getElementById('SignUpModal')).hide()
    }

    function forceLogin() {
      event.preventDefault();
      alert('Versão de Testes\nLogin efetuado automaticamente.')
      let usuario = {
        "email_login": 'admin@admin.com',
        "senha": 'admin',
      };

      // Inclui o novo usuario no banco de dados baseado em JSON
      db_usuarios.usuarios.push(usuario);

      // Salva o novo banco de dados com o novo usuário no localStorage
      localStorage.setItem('db_usuarios', JSON.stringify(db_usuarios));



      // Obtem os dados de login e senha a partir do formulário de login
      var username = 'admin@admin.com'
      var password = 'admin';

      // Valida login e se estiver ok, redireciona para tela inicial da aplicação
      resultadoLogin = loginUser(username, password);
      if (resultadoLogin) {
        window.location.href = 'dashboard.html';
      }
      else { // Se login falhou, avisa ao usuário
        alert('Usuário ou senha incorretos');
      }
    }

    // associa função makeTest ao botão
    document.getElementById('efetuar-teste').addEventListener('click', makeTest);


    // Associa a funçao processaFormLogin  formulário adicionado um manipulador do evento submit
    // document.getElementById('login-form').addEventListener('submit', processaFormLogin);
    document.getElementById('login-form').addEventListener('submit', forceLogin);










    // Associar salvamento ao botao
    document.getElementById('btn_salvar').addEventListener('click', salvaLogin);        
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
